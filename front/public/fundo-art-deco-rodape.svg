<svg width="1600" height="300" viewBox="0 0 1600 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="artDecoFan" width="200" height="300" patternUnits="userSpaceOnUse">
      <!-- Leque central (motivo clássico art deco) -->
      <g stroke="#F6E7B5" stroke-width="2" fill="none">
        <path d="M100,300 L100,180 M100,300 L60,190 M100,300 L140,190 M100,300 L30,220 M100,300 L170,220 M100,300 L10,260 M100,300 L190,260" />
        <path d="M40,300 A60,60 0 0,1 160,300" />
        <path d="M55,300 A45,45 0 0,1 145,300" />
      </g>

      <!-- Linhas verticais decorativas -->
      <g stroke="#F6E7B5" stroke-width="1.5" opacity="0.7">
        <line x1="0" y1="0" x2="0" y2="150" />
        <line x1="200" y1="0" x2="200" y2="150" />
      </g>

      <!-- Losangos no topo -->
      <g fill="#F6E7B5">
        <polygon points="100,10 115,30 100,50 85,30" />
        <polygon points="20,40 30,55 20,70 10,55" />
        <polygon points="180,40 190,55 180,70 170,55" />
      </g>

      <!-- Linhas em degrau (stepped lines), típico art deco -->
      <g stroke="#F6E7B5" stroke-width="2" fill="none" opacity="0.8">
        <path d="M0,90 L40,90 L40,100 L80,100 L80,90 L120,90 L120,100 L160,100 L160,90 L200,90" />
      </g>

      <!-- Bordas superior e inferior -->
      <line x1="0" y1="0" x2="200" y2="0" stroke="#F6E7B5" stroke-width="1" />
      <line x1="0" y1="300" x2="200" y2="300" stroke="#F6E7B5" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1600" height="300" fill="url(#artDecoFan)" />
</svg>
