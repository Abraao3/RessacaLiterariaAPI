name: CI - Run API and Test Routes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Subir servidor FastAPI em background
        run: |
          # Ajuste "main:app" para o módulo/objeto correto do seu projeto
          nohup uvicorn main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          echo $! > server.pid

      - name: Esperar servidor ficar pronto
        run: |
          for i in {1..15}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs | grep -q "200"; then
              echo "Servidor está no ar!"
              exit 0
            fi
            echo "Aguardando servidor iniciar... ($i)"
            sleep 2
          done
          echo "Servidor não respondeu a tempo."
          cat server.log
          exit 1

      - name: Testar rota raiz
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/)
          echo "Status /: $status"
          if [ "$status" -ge 400 ]; then
            echo "Rota raiz falhou"
            exit 1
          fi

      - name: Testar documentação (Swagger)
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/docs)
          echo "Status /docs: $status"
          if [ "$status" -ne 200 ]; then
            exit 1
          fi

      # Adicione aqui outros testes de rota específicos do seu projeto, por exemplo:
      #
      # - name: Testar rota de tarefas
      #   run: |
      #     status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/tasks)
      #     echo "Status /tasks: $status"
      #     if [ "$status" -ge 400 ]; then
      #       exit 1
      #     fi
      #
      # - name: Testar login (JWT)
      #   run: |
      #     response=$(curl -s -X POST http://localhost:8000/login \
      #       -H "Content-Type: application/x-www-form-urlencoded" \
      #       -d "username=teste&password=senha123")
      #     echo "$response" | grep -q "access_token"

      - name: Mostrar logs do servidor (debug)
        if: always()
        run: cat server.log || true

      - name: Encerrar servidor
        if: always()
        run: kill $(cat server.pid) || true
